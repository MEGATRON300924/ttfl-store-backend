name: Keep Render Backend Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          HEALTH_URL: https://YOUR-RENDER-SERVICE.onrender.com/health
        run: |
          set -e
          echo "Pinging $HEALTH_URL"
          curl --fail --silent --show-error --max-time 20 "$HEALTH_URL"
          echo
          echo "Render backend is responding."
